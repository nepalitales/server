#:schema node_modules/wrangler/config-schema.json
name = "nepali-tales-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[alias]
whatwg-url = "./src/shims/whatwg-url.ts"

[observability]
enabled = true

[vars]
MONGODB_DB_NAME = "nepali-tales"
KITCHEN_ADDRESS = "Metropolis Riveria, Kasarvadavali, Ghodbunder Road, Thane, Maharashtra 400615"
KITCHEN_PHONE = "917678097659"
# NODE_ENV defaults to "production" via env schema.
# Set NODE_ENV = "development" in .dev.vars for local dev.

# Production Secrets: Set via Cloudflare Dashboard or `npx wrangler secret put <NAME>`
# 1. Database
#    npx wrangler secret put MONGODB_URI
# 2. Razorpay
#    npx wrangler secret put RAZORPAY_KEY_ID
#    npx wrangler secret put RAZORPAY_KEY_SECRET
#    npx wrangler secret put RAZORPAY_WEBHOOK_SECRET
# 3. Borzo Porter Dispatch Service
#    npx wrangler secret put BORZO_SERVICE_URL
#    npx wrangler secret put BORZO_SERVICE_KEY
# 4. Cloudinary (Food Menu Images)
#    npx wrangler secret put CLOUDINARY_CLOUD_NAME
#    npx wrangler secret put CLOUDINARY_API_KEY
#    npx wrangler secret put CLOUDINARY_API_SECRET
# 5. Sentry (Error Tracking & Alerting)
#    npx wrangler secret put SENTRY_DSN

